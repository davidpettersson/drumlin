[package]
name = "mdbook-drumlin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["David Pettersson"]
description = "mdBook preprocessor that renders drumlin code fences to inline SVG"
repository = "https://github.com/davidpettersson/drumlin"
homepage = "https://davidpettersson.github.io/drumlin/internals/build.html"
keywords = ["mdbook", "uml", "diagram", "svg", "preprocessor"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
drumlin = { path = "../..", version = "0.2.0-dev" }
serde_json = "1"
