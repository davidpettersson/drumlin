<svg xmlns="http://www.w3.org/2000/svg" class="drumlin pens" viewBox="-24 -56 408 400" width="408" height="400">
<style>
.drumlin.pens text { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; fill: #22201c; font-weight: 400; }
.drumlin.pens .title { font-size: 16px; font-weight: 600; }
.drumlin.pens .name { font-size: 13px; font-weight: 600; }
.drumlin.pens .italic { font-style: italic; }
.drumlin.pens .small { font-size: 11px; }
.drumlin.pens .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.drumlin.pens .tag { font-size: 10px; letter-spacing: 0.2px; fill: #5c574f; }
.drumlin.pens .aside { fill: #5c574f; }
.drumlin.pens .shape { fill: #fff; stroke: #22201c; stroke-width: 1.25; stroke-linejoin: miter; }
.drumlin.pens .icon { fill: #fff; stroke: #22201c; stroke-width: 0.75; stroke-linejoin: miter; }
.drumlin.pens .edge { fill: none; stroke: #22201c; stroke-width: 1.25; stroke-linecap: butt; stroke-linejoin: miter; }
.drumlin.pens .head { stroke-linejoin: miter; stroke-miterlimit: 4; }
.drumlin.pens .dashed { stroke-dasharray: 7 3; }
.drumlin.pens .solid { fill: #22201c; stroke: none; }
.drumlin.pens .heavy { stroke-width: 1.75; }
.drumlin.pens .fine { stroke-width: 0.75; }
</style>
