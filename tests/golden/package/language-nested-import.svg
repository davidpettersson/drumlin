<rect x="24" y="64" width="112" height="48" class="shape"/>
<text x="80" y="92.5" class="name" text-anchor="middle">Scheduler</text>
<path d="M80 112 L80 160" class="edge dashed fine"/>
<path d="M75.5 150 L80 160 L84.5 150" class="edge head fine"/>
