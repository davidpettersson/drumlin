<svg xmlns="http://www.w3.org/2000/svg" class="drumlin pens" viewBox="-24 -56 464 320" width="464" height="320">
<style>
.drumlin.pens text { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; fill: #22201c; }
.drumlin.pens .title { font-size: 16px; font-weight: 600; }
.drumlin.pens .name { font-size: 13px; font-weight: 600; }
.drumlin.pens .italic { font-style: italic; }
.drumlin.pens .small { font-size: 11px; fill: #22201c; }
.drumlin.pens .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.drumlin.pens .shape { fill: #fff; stroke: #22201c; stroke-width: 1.25; stroke-linejoin: miter; }
.drumlin.pens .icon { fill: #fff; stroke: #22201c; stroke-width: 0.75; stroke-linejoin: miter; }
.drumlin.pens .edge { fill: none; stroke: #22201c; stroke-width: 1.25; stroke-linecap: butt; stroke-linejoin: miter; }
.drumlin.pens .head { stroke-linejoin: miter; stroke-miterlimit: 4; }
.drumlin.pens .dashed { stroke-dasharray: 7 3; }
.drumlin.pens .heavy { stroke-width: 1.75; }
.drumlin.pens .fine { stroke-width: 0.75; }
</style>
<rect x="-24" y="-56" width="464" height="320" fill="#fff"/>
<text x="0" y="-20" class="title">Unconnected members fold into rows</text>
<rect x="0" y="0" width="64.2" height="24" class="shape heavy"/>
<rect x="0" y="24" width="416" height="216" class="shape heavy"/>
<text x="12" y="16.5" class="name" text-anchor="start">Kernel</text>
<rect x="24" y="48" width="96" height="48" class="shape"/>
<text x="72" y="76.5" class="name" text-anchor="middle">Scheduler</text>
<rect x="160" y="48" width="96" height="48" class="shape"/>
<text x="208" y="76.5" class="name" text-anchor="middle">Timer</text>
<rect x="296" y="48" width="96" height="48" class="shape"/>
<text x="344" y="76.5" class="name" text-anchor="middle">Mutex</text>
<rect x="24" y="160" width="96" height="48" class="shape"/>
<text x="72" y="188.5" class="name" text-anchor="middle">Channel</text>
<rect x="160" y="160" width="96" height="48" class="shape"/>
<text x="208" y="188.5" class="name" text-anchor="middle">Pipe</text>
<rect x="296" y="160" width="96" height="48" class="shape"/>
<text x="344" y="188.5" class="name" text-anchor="middle">Signal</text>
