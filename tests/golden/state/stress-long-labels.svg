<text x="0" y="177" class="small" text-anchor="start">a very long trigger name with</text>
<text x="0" y="190" class="small" text-anchor="start">many words [and a guard that</text>
<text x="0" y="203" class="small" text-anchor="start">keeps going for a while]</text>
<text x="0" y="216" class="small" text-anchor="start">/ then an effect that also goes on</text>
<text x="0" y="229" class="small" text-anchor="start">and on</text>
<text x="200" y="190" class="small" text-anchor="start">another long one [x &gt; 0 and y &lt; 0]</text>
<text x="200" y="203" class="small" text-anchor="start">/ do_something_with_a_long_name(argument,</text>
<text x="200" y="216" class="small" text-anchor="start">another_argument)</text>
<text x="80" y="355" class="small" text-anchor="start">short</text>
<text x="464" y="190" class="small" text-anchor="start">reset everything back to the</text>
<text x="464" y="203" class="small" text-anchor="start">beginning</text>
<text x="464" y="216" class="small" text-anchor="start">/ clear()</text>
<text x="88" y="499" class="small" text-anchor="start">give up</text>
<text x="168" y="414" class="small" text-anchor="start">retry the operation again [attempts</text>
<text x="168" y="427" class="small" text-anchor="start">remaining]</text>
<text x="168" y="440" class="small" text-anchor="start">/ backoff()</text>
<text x="192" y="343" class="small" text-anchor="start">somewhat longer label here [flag]</text>
</svg>
