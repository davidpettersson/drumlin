<svg xmlns="http://www.w3.org/2000/svg" class="drumlin pens" viewBox="-64 -56 248 304" width="248" height="304">
<style>
.drumlin.pens text { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; fill: #22201c; font-weight: 400; }
.drumlin.pens .title { font-size: 16px; font-weight: 600; }
.drumlin.pens .name { font-size: 13px; font-weight: 600; }
.drumlin.pens .italic { font-style: italic; }
.drumlin.pens .small { font-size: 11px; }
.drumlin.pens .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.drumlin.pens .tag { font-size: 10px; letter-spacing: 0.2px; fill: #5c574f; }
.drumlin.pens .aside { fill: #5c574f; }
.drumlin.pens .shape { fill: #fff; stroke: #22201c; stroke-width: 1.25; stroke-linejoin: miter; }
.drumlin.pens .icon { fill: #fff; stroke: #22201c; stroke-width: 0.75; stroke-linejoin: miter; }
.drumlin.pens .edge { fill: none; stroke: #22201c; stroke-width: 1.25; stroke-linecap: butt; stroke-linejoin: miter; }
.drumlin.pens .head { stroke-linejoin: miter; stroke-miterlimit: 4; }
.drumlin.pens .dashed { stroke-dasharray: 7 3; }
.drumlin.pens .lifeline { fill: none; stroke: #22201c; stroke-width: 0.75; stroke-dasharray: 7 3; }
.drumlin.pens .frame { fill: none; stroke: #22201c; stroke-width: 0.75; stroke-linejoin: miter; }
.drumlin.pens .solid { fill: #22201c; stroke: none; }
.drumlin.pens .heavy { stroke-width: 1.75; }
.drumlin.pens .fine { stroke-width: 0.75; }
</style>
<rect x="-64" y="-56" width="248" height="304" fill="#fff"/>
<text x="-40" y="-20" class="title">Worker lifetime</text>
<path d="M0 40 L0 224" class="lifeline"/>
<path d="M120 92 L120 200" class="lifeline"/>
<rect x="114" y="120" width="12" height="32" class="shape"/>
<rect x="-40" y="0" width="80" height="40" class="shape"/>
<text x="0" y="24" class="name" text-anchor="middle">Pool</text>
<rect x="80" y="52" width="80" height="40" class="shape"/>
<text x="120" y="76" class="name" text-anchor="middle">Worker</text>
<path d="M0 72 L80 72" class="edge dashed fine"/>
<path d="M70 76.5 L80 72 L70 67.5" class="edge head fine"/>
<path d="M0 120 L114 120" class="edge"/>
<path d="M104 124.5 L114 120 L104 115.5 Z" class="solid"/>
<path d="M114 152 L0 152" class="edge dashed fine"/>
<path d="M10 147.5 L0 152 L10 156.5" class="edge head fine"/>
<path d="M0 184 L120 184" class="edge"/>
<path d="M110 188.5 L120 184 L110 179.5" class="edge head"/>
<path d="M113 193 L127 207 M113 207 L127 193" class="edge"/>
