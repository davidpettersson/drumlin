<svg xmlns="http://www.w3.org/2000/svg" class="drumlin pens" viewBox="-24 -56 400 248" width="400" height="248">
<style>
.drumlin.pens text { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; fill: #22201c; }
